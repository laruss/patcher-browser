name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.x"
  BUN_VERSION: "1.3.14"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: checks

      - name: Build, typecheck, and lint
        run: bunx turbo run build typecheck lint --cache-dir=.turbo/cache --output-logs=new-only

      # Guards the JavaScript that blocks first paint in the web app. Heavy
      # editor, diff and math code reaches that path through barrel re-exports,
      # which typecheck and lint cannot see.
      - name: Check app boot-payload budget
        run: node apps/app/scripts/check-bundle-budget.mjs

      # Guards the rename (docs/architecture/rename-to-patcher.md). Every old
      # token left in the tree is either frozen on the wire, a physical
      # database name, history, or an English word, and each one is answered by
      # a rule that says which. A new one is a regression, and so is a
      # `patcher` welded into the middle of a word.
      - name: Audit the Patcher rename
        run: node scripts/rename-audit.mjs

      # How long a source file may be, as an error rather than a warning:
      # `desktop-browser-view.ts` was 819 lines at Phase 0 and is 5 742 now, and
      # nothing above says when a file crossed from long to unreadable. Its own
      # step because `turbo run lint` above finds one lint task — `@patcher/app`
      # is the only package that declares one — and this is the one rule that
      # has to see the whole tree. The files already over the limit are pinned
      # at their current size in eslint.max-lines.mjs and may only shrink.
      - name: Check source file sizes
        run: bun run lint:file-size

  # Tests run on their own runners instead of inside the checks job: the big
  # suites are CPU-bound and previously fought each other (and the builds) for
  # the same 4 vCPUs, which made tests the critical path of every run.
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@patcher/server
          - shard: app
            filter: --filter=@patcher/app
          - shard: integration
            filter: --filter=@patcher/integration-tests
          - shard: packages
            filter: --filter='!@patcher/server' --filter='!@patcher/app' --filter='!@patcher/integration-tests'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: test-${{ matrix.shard }}

      - name: Install the Linux sandbox backend
        # A workspace permission mode refuses to start on a machine that cannot
        # build a sandbox, by design — see `resolveWorkspaceSandboxAvailability`
        # in claude-code/bridge/session-options.ts. macOS composes one from
        # Seatbelt; Linux needs bubblewrap, so without it the bridge tests that
        # drive a sandboxed mode through the real JSON-RPC path fail on the
        # runner's own platform. Installing it also means Linux CI exercises the
        # sandbox rather than the refusal.
        #
        # Installed is not the same as usable. Ubuntu 24.04 restricts
        # unprivileged user namespaces through AppArmor, so `bwrap` answers
        # "setting up uid map: Permission denied" for every command — measured
        # on this runner, where the terminal sandbox's own behavioural tests
        # failed exactly that way. Lifting the restriction is what lets Linux CI
        # run the sandbox instead of asserting the refusal; the daemon probes
        # for this and refuses the terminal where it cannot be lifted.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev-bind /dev /dev /bin/true \
            && echo "bubblewrap can build a sandbox on this runner" \
            || echo "bubblewrap cannot build a sandbox here; the suite will assert the refusal"

      - name: Test
        # --concurrency matches the root `test` script: the packages shard runs
        # everything that spawns git, watchers and daemons, and vitest already
        # sizes each package's worker pool to the runner. See the test
        # parallelism caveat in docs/architecture/bb-migration.md.
        run: bunx turbo run test ${{ matrix.filter }} --concurrency=2 --cache-dir=.turbo/cache --output-logs=new-only

  # The one gate that opens the app. Everything above can be green while the
  # window is white: the build externalizes a Node builtin with a warning and
  # exits 0, the boot-payload budget counts bytes, and every vitest suite runs
  # in Node, where jsdom loads no bundle and `node:crypto` resolves for real.
  # This boots the SPA in the Chromium the product ships — from the dev server
  # and from `dist` — and fails on an uncaught error, a dead renderer, or a
  # `#root` that never gets children. macOS because that is where this repo
  # already runs Electron in CI, and because it is the platform the desktop
  # app ships on.
  app-boot-smoke:
    name: App Boot Smoke (macos-latest, Node 22.x)
    runs-on: macos-latest
    # Short on purpose: this job either opens the app in a couple of minutes or
    # something is wrong with it, and the first run of it spent half an hour
    # hanging silently before the runner killed it.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: app-boot-smoke

      - name: Build the app
        run: bunx turbo run build --filter=@patcher/app --cache-dir=.turbo/cache --output-logs=new-only

      # The script rather than the turbo task: turbo buffers a task's output
      # until it finishes, so a smoke that hangs prints nothing at all — which
      # is how the first run of this job left a log with no clue in it. Run
      # directly, the stages stream as they happen.
      - name: Boot the app and fail on any start-up error
        run: node apps/desktop/scripts/smoke-app-boot.mjs

  package-smoke:
    name: Package Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.x"
          - os: macos-latest
            node-version: "22.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: package-smoke

      - name: Smoke patcher-app tarball
        run: bunx turbo run smoke:tarball --filter=patcher-app --cache-dir=.turbo/cache --output-logs=new-only

  node-compat-smoke:
    name: Node Compatibility Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "24.x"
          - os: ubuntu-latest
            node-version: "26.x"
          - os: macos-latest
            node-version: "24.x"
          - os: macos-latest
            node-version: "26.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          bun-version: ${{ env.BUN_VERSION }}
          cache-prefix: compat-smoke

      - name: Smoke patcher-app tarball
        run: bunx turbo run smoke:tarball --filter=patcher-app --cache-dir=.turbo/cache --output-logs=new-only
